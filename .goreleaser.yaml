version: 2
project_name: ws

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rtxnik/workspace-cli/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  - id: minisign
    cmd: minisign
    # Sign the checksum manifest only. checksums.txt already enumerates every
    # archive's SHA-256, so one signature transitively authenticates all
    # artifacts. Default (non-prehashed) format — keep sign and verify
    # symmetric; do NOT add -l, and do NOT add -H to only one side.
    args:
      - "-S"
      - "-s"
      - "{{ .Env.MINISIGN_SECRET_KEY_FILE }}"
      - "-m"
      - "${artifact}"
      - "-x"
      - "${signature}"
    signature: "${artifact}.minisig"
    artifacts: checksum
    # minisign reads the secret-key password from stdin when stdin is not a TTY.
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"

sboms:
  - id: archive
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
