version: 2

updates:
  # Go module dependencies: one grouped PR per week.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      go-deps:
        patterns:
          - "*"
    ignore:
      # From v0.11.7, x/ansi's StringWidth measures a grapheme cluster that
      # starts with an ASCII character as one unit, while its Truncate, Wrap
      # and DecodeSequence still count that character on its own. lipgloss
      # sizes a table cell with the first and lays it out with the second, so a
      # cell fitted exactly to its column re-wraps onto a second line. Held at
      # v0.11.6 until the two agree; a later release is proposed as usual.
      - dependency-name: "github.com/charmbracelet/x/ansi"
        versions: ["0.11.7", "0.11.8"]
    # Version updates wait for a package to settle; security updates bypass this.
    cooldown:
      default-days: 7
      semver-major-days: 14

  # GitHub Actions pinned in workflows: one grouped PR per week.
  # Dependabot bumps the SHA pin AND refreshes the trailing "# vX.Y.Z" comment;
  # it does not un-pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
    # semver-major-days is unsupported for the github-actions ecosystem
    # (Dependabot schema); actions updates use the default cooldown only.
    cooldown:
      default-days: 7
