name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 30" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 30% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: gofmt (changed Go files)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1 || base="$(git rev-parse origin/main 2>/dev/null || echo HEAD~1)"
          mapfile -t files < <(git diff --name-only --diff-filter=d "$base" HEAD -- '*.go')
          if [ "${#files[@]}" -gt 0 ]; then
            drift=$(gofmt -l "${files[@]}")
            if [ -n "$drift" ]; then
              echo "::error::gofmt drift in changed files:"; echo "$drift"; exit 1
            fi
          fi
