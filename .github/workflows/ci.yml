name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - run: go vet ./...
      - name: assert-ran guard self-test (H7 anti-false-green guard-of-the-guard)
        run: bash scripts/ci/assert-ran_test.sh
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 30" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 30% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: gofmt (changed Go files)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1 || base="$(git rev-parse origin/main 2>/dev/null || echo HEAD~1)"
          mapfile -t files < <(git diff --name-only --diff-filter=d "$base" HEAD -- '*.go')
          if [ "${#files[@]}" -gt 0 ]; then
            drift=$(gofmt -l "${files[@]}")
            if [ -n "$drift" ]; then
              echo "::error::gofmt drift in changed files:"; echo "$drift"; exit 1
            fi
          fi

  datapath:
    runs-on: ubuntu-latest
    # Hard ceiling: every docker command in the gate is also timeout-wrapped, but
    # this guarantees the job can never hang the workflow (a prior diagnostic did).
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      # Full commit SHA of dotfiles main after PR rtxnik/dotfiles#15 merged
      # (the self-egress mangle-OUTPUT-MARK entrypoint). actions/checkout requires
      # a full 40-char SHA or a branch/tag name — a short SHA is treated as a
      # branch pattern and fails to resolve. Pin a SHA (not `main`) so the gate is
      # reproducible; bump it when the proxy recipe changes again.
      DOTFILES_REF: "38c4accb4c9c09f2d5f82510e898fd7d6bcde51f"
      # WS_TEST_URI drives strict mode (real profile + exit-IP assertion).
      # If the WS_TEST_ENDPOINT secret is unset the gate runs in flow-only mode
      # (TPROXY preconditions + forwarding leg asserted; exit-IP comparison skipped).
      WS_TEST_URI: ${{ secrets.WS_TEST_ENDPOINT }}
      # Deterministic tag so the gate builds it and the H6/H7 steps reuse the
      # same image from the runner's docker daemon (no rebuild, one source of truth).
      WS_PROXY_IMAGE: ws-proxy:gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Preflight — load TPROXY kernel modules
        run: |
          sudo modprobe xt_TPROXY xt_socket || {
            echo "::error::runner kernel lacks xt_TPROXY/xt_socket; datapath gate cannot run"
            exit 1
          }
      - name: Checkout dotfiles proxy recipe (pinned)
        uses: actions/checkout@v4
        with:
          repository: rtxnik/dotfiles
          ref: ${{ env.DOTFILES_REF }}
          path: _dotfiles
      - name: Build ws
        run: make build
      - name: Stage proxy recipe where ws expects it
        run: |
          mkdir -p "$HOME/.config/workspaces/profiles"
          cp -r _dotfiles/dot_config/workspaces/profiles/proxy "$HOME/.config/workspaces/profiles/proxy"
      - name: Run red-line datapath gate (T2-T5 + T13)
        run: sudo -E WS_BIN="$PWD/ws" bash scripts/ci/datapath-gate.sh

      - name: H6 — xray -test over goldens + VLESS matrix (semantic golden gate)
        run: |
          set -o pipefail
          go test -tags docker_e2e ./cmd/ -run TestXrayValidatesConfigs -v 2>&1 | tee /tmp/h6.log
          bash scripts/ci/assert-ran.sh TestXrayValidatesConfigs < /tmp/h6.log

      - name: Restart dev-proxy for H7 (T13 left it stopped)
        run: |
          # T13 disabled the restart policy and killed xray (PID 1), leaving
          # dev-proxy stopped. Restore the restart policy and bring it back up
          # so requireDevProxy (docker ps -q -f name=dev-proxy) sees it running.
          docker update --restart=unless-stopped dev-proxy
          docker start dev-proxy
          # Wait until the container is healthy / running before proceeding.
          for i in $(seq 1 15); do
            status="$(docker inspect -f '{{.State.Status}}' dev-proxy 2>/dev/null || echo missing)"
            if [ "$status" = "running" ]; then
              echo "dev-proxy is running"
              break
            fi
            echo "waiting for dev-proxy ($status) ... $i/15"
            sleep 1
          done

      - name: H7 — proxy profile-lifecycle integration (dev-proxy is up)
        run: |
          set -o pipefail
          go test -tags integration ./internal/xray/ \
            -run 'TestIntegration_Cycle|TestProfileLifecycleE2E|TestExistingStateDiscovery' -v 2>&1 | tee /tmp/h7.log
          bash scripts/ci/assert-ran.sh TestIntegration_Cycle < /tmp/h7.log

      - name: H7 (strict) — full-tunnel e2e (only when WS_TEST_URI is set)
        if: ${{ env.WS_TEST_URI != '' }}
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee /tmp/e2e.log
          bash scripts/ci/assert-ran.sh TestProxyE2E < /tmp/e2e.log

  snapshot-gate:
    name: Release snapshot + signature/SBOM gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate ephemeral minisign key
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d)"
          printf 'ci-snapshot\nci-snapshot\n' | minisign -G \
            -p "${key_dir}/minisign.pub" \
            -s "${key_dir}/minisign.key"
          {
            echo "MINISIGN_SECRET_KEY_FILE=${key_dir}/minisign.key"
            echo "MINISIGN_PUBLIC_KEY_FILE=${key_dir}/minisign.pub"
            echo "MINISIGN_PASSWORD=ci-snapshot"
          } >> "$GITHUB_ENV"
      - name: Build snapshot release with signing + SBOMs
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          MINISIGN_SECRET_KEY_FILE: ${{ env.MINISIGN_SECRET_KEY_FILE }}
          MINISIGN_PASSWORD: ${{ env.MINISIGN_PASSWORD }}
      - name: Verify signature + SBOM artifacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -f dist/checksums.txt.minisig
          minisign -V -p "${MINISIGN_PUBLIC_KEY_FILE}" -m dist/checksums.txt -x dist/checksums.txt.minisig
          ls dist/*.sbom.json >/dev/null 2>&1 || { echo "::error::no SBOM artifacts produced"; exit 1; }
      - name: Exercise the verified installer
        run: sh scripts/install_test.sh
